# yaml-language-server: $schema=../../schemas/yaml/services_schema.yaml
evaluate_batch:
  name: Evaluate Batch
  description: Evaluate all rooms and trigger cleaning for overdue rooms with open doors.
  fields:
    vacuum_entity:
      name: Vacuum Entity
      description: Optional vacuum entity ID to filter rooms by.
      selector:
        entity:
          domain: vacuum
      example: vacuum.roborock
    dry_run:
      name: Dry Run
      description: If true, only return the list of rooms without triggering cleaning.
      selector:
        boolean:
      default: false
      example: true

record_cleaning:
  name: Record Cleaning
  description: Manually record that a room has been cleaned.
  fields:
    room_name:
      name: Room Name
      description: The name of the room that was cleaned.
      required: true
      selector:
        text:
      example: Kitchen
    mode:
      name: Cleaning Mode
      description: The type of cleaning performed.
      required: true
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_and_mop
      example: vacuum
    timestamp:
      name: Timestamp
      description: Optional ISO format timestamp. Defaults to now.
      selector:
        text:
      example: "2026-06-10T09:30:00"
